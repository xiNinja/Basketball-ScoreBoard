    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            <div>
                <h3 id="home">HOME</h3>
                <p id="home-score"> 0</p>

                <button id="add3pointhome-btn" onclick="add3pointshome()">+3</button>
            </div>
            <div>
                <h3 id="guest">GUEST</h3>
            <p id="away-score"> 0</p>
            <button id="add1pointaway-btn" onclick="add1pointsaway()">+1</button>
            <button id="add2pointaway-btn" onclick="add2pointsaway()">+2</button>
            <button id="add3pointaway-btn" onclick="add3pointsaway()">+3</button>
            </div>
            
        </div>
        <button id="newgame-btn" onclick="newgame()">New Game</button>
        <script src="index.js"></script>
    </body>
